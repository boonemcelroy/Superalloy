# ==============================================================================
#  Superalloy — macOS VST3 build (Intel + Apple Silicon, one universal binary)
#
#  build        macos-15 (Apple Silicon): universal arm64 + x86_64 VST3,
#               verifySuperalloy (native arm64), ad-hoc signature, or Developer
#               ID signing + notarisation when the secrets below exist, then
#               hostcheckSuperalloy (loads the signed VST3 in a JUCE VST3 host:
#               hookup, audible effect, true bypass, recall) and pluginval
#               strictness 10.
#  test-intel   macos-15-intel: runs verifySuperalloy, hostcheckSuperalloy and
#               pluginval on the x86_64 slice of the exact same binary, on real
#               Intel hardware.
#  package      macos-pkg.yml: wraps the same tested VST3 in an Installer
#               package (.pkg), installs it on Apple Silicon and Intel and
#               re-runs hostcheck + pluginval on the installed plug-in.
#  release      on a tag v*: publishes the zip and the .pkg as a GitHub Release.
#
#  Optional secrets (all six needed for Developer ID signing + notarisation):
#    MACOS_CERT_P12_BASE64   base64 of your "Developer ID Application" .p12
#    MACOS_CERT_PASSWORD     password of that .p12
#    MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
#    APPLE_ID                Apple ID e-mail
#    APPLE_TEAM_ID           10-character team ID
#    APPLE_APP_PASSWORD      app-specific password for notarytool
# ==============================================================================
name: macOS VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PLUGIN: Superalloy
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD:   ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY:   ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID:              ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD:    ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Configure (universal arm64 + x86_64, macOS 11+)
        run: >
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DWAVRELY_BUILD_VERIFY=ON
          -DWAVRELY_BUILD_HOSTCHECK=ON

      - name: Build
        run: cmake --build build --config Release --target ${PLUGIN}_VST3 verifySuperalloy hostcheckSuperalloy -j "$(sysctl -n hw.ncpu)"

      - name: Locate artefacts and check both architectures
        run: |
          VST3="build/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3"
          test -d "$VST3"
          BIN="$VST3/Contents/MacOS/${PLUGIN}"
          echo "VST3 slices:   $(lipo -archs "$BIN")"
          cp build/hostcheckSuperalloy_artefacts/Release/hostcheckSuperalloy build/hostcheckSuperalloy
          echo "verify slices: $(lipo -archs build/verifySuperalloy)"
          echo "host slices:   $(lipo -archs build/hostcheckSuperalloy)"
          lipo "$BIN" -verify_arch arm64 x86_64
          lipo build/verifySuperalloy -verify_arch arm64 x86_64
          lipo build/hostcheckSuperalloy -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$VST3/Contents/Info.plist"
          echo "VST3=$VST3" >> "$GITHUB_ENV"

      - name: verifySuperalloy (Apple Silicon, native arm64)
        run: |
          mkdir -p reports-ci
          arch -arm64 build/verifySuperalloy | tee reports-ci/verifySuperalloy_macos_arm64.txt
          grep -q "RESULT: ALL TESTS PASSED" reports-ci/verifySuperalloy_macos_arm64.txt

      - name: Ad-hoc sign (no Developer ID secrets)
        if: env.MACOS_CERT_P12_BASE64 == ''
        run: |
          codesign --force --deep --sign - "$VST3"
          codesign --verify --deep --strict --verbose=2 "$VST3"

      - name: Developer ID sign
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPW="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$VST3"
          codesign --verify --deep --strict --verbose=2 "$VST3"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Notarise and staple
        if: env.MACOS_CERT_P12_BASE64 != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          ditto -c -k --keepParent "$VST3" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$VST3"
          xcrun stapler validate "$VST3"

      - name: hostcheckSuperalloy (Apple Silicon, signed VST3 in a VST3 host)
        run: |
          arch -arm64 build/hostcheckSuperalloy "$VST3" | tee reports-ci/hostcheckSuperalloy_macos_arm64.txt
          grep -q "RESULT: ALL CHECKS PASSED" reports-ci/hostcheckSuperalloy_macos_arm64.txt

      - name: pluginval strictness 10 (Apple Silicon)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" "$PLUGINVAL_URL"
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"
          PV="$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"
          arch -arm64 "$PV" --strictness-level 10 --validate-in-process --validate "$VST3" \
            | tee reports-ci/pluginval_macos_arm64.txt
          grep -q "SUCCESS" reports-ci/pluginval_macos_arm64.txt

      - name: Package
        run: |
          STAGE="$RUNNER_TEMP/${PLUGIN}-macOS"
          mkdir -p "$STAGE"
          ditto "$VST3" "$STAGE/${PLUGIN}.vst3"
          cp reports-ci/*.txt "$STAGE/"
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then SIGNED="Developer ID signed and notarised."; else SIGNED="Ad-hoc signed (not notarised)."; fi
          cat > "$STAGE/INSTALL.txt" <<EOF
          Superalloy VST3 for macOS — universal binary (Intel x86_64 + Apple Silicon arm64), macOS 11 or newer.
          ${SIGNED}

          Install: copy Superalloy.vst3 to /Library/Audio/Plug-Ins/VST3/
                   (or ~/Library/Audio/Plug-Ins/VST3/ for your user only), then rescan in your DAW.

          If this build is ad-hoc signed, macOS blocks it after a browser download. Clear the
          quarantine flag once, in Terminal:
            xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/Superalloy.vst3
          EOF
          ditto -c -k --keepParent "$STAGE" "$RUNNER_TEMP/${PLUGIN}-macOS-universal.zip"
          cp "$RUNNER_TEMP/${PLUGIN}-macOS-universal.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: Superalloy-macOS-universal
          path: Superalloy-macOS-universal.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: verify-binary
          path: |
            build/verifySuperalloy
            build/hostcheckSuperalloy
          if-no-files-found: error

  test-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Superalloy-macOS-universal
      - uses: actions/download-artifact@v4
        with:
          name: verify-binary
          path: verify

      - name: Unpack
        run: |
          uname -m
          ditto -x -k Superalloy-macOS-universal.zip .
          echo "VST3=$PWD/Superalloy-macOS/Superalloy.vst3" >> "$GITHUB_ENV"
          chmod +x verify/verifySuperalloy verify/hostcheckSuperalloy

      - name: verifySuperalloy (Intel, native x86_64)
        run: |
          arch -x86_64 verify/verifySuperalloy | tee verifySuperalloy_macos_x86_64.txt
          grep -q "RESULT: ALL TESTS PASSED" verifySuperalloy_macos_x86_64.txt

      - name: hostcheckSuperalloy (Intel, native x86_64)
        run: |
          arch -x86_64 verify/hostcheckSuperalloy "$VST3" | tee hostcheckSuperalloy_macos_x86_64.txt
          grep -q "RESULT: ALL CHECKS PASSED" hostcheckSuperalloy_macos_x86_64.txt

      - name: pluginval strictness 10 (Intel)
        run: |
          curl -fsSL -o pluginval.zip "$PLUGINVAL_URL"
          ditto -x -k pluginval.zip pluginval
          arch -x86_64 pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 --validate-in-process --validate "$VST3" | tee pluginval_macos_x86_64.txt
          grep -q "SUCCESS" pluginval_macos_x86_64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: intel-reports
          path: |
            verifySuperalloy_macos_x86_64.txt
            hostcheckSuperalloy_macos_x86_64.txt
            pluginval_macos_x86_64.txt

  package:
    needs: [ build, test-intel ]
    uses: ./.github/workflows/macos-pkg.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, test-intel, package ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Superalloy-macOS-universal
      - uses: actions/download-artifact@v4
        with:
          name: Superalloy-macOS-universal-pkg
          path: pkg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Superalloy-macOS-universal.zip pkg/*.pkg \
            --repo "$GITHUB_REPOSITORY" --title "Superalloy $GITHUB_REF_NAME" \
            --notes "Universal VST3 for macOS 11+ (Intel and Apple Silicon), as a zip and as an Installer package (.pkg). Tested on both architectures with verifySuperalloy, hostcheckSuperalloy and pluginval strictness 10; the .pkg is installed and re-tested on both."
